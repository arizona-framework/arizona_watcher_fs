name: Erlang

"on":
  push:
    branches:
      - main
  pull_request:
    branches:
      - "*"
  workflow_dispatch: {}

concurrency:
  group: ${{github.workflow}}-${{github.ref}}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: CI

    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24
        id: setup-beam
        with:
          version-type: strict
          version-file: .tool-versions

      # fs drives inotifywait on Linux; the integration tests watch a real directory.
      - name: Install inotify-tools
        run: sudo apt-get update && sudo apt-get install -y inotify-tools

      - name: Cache rebar3
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/rebar3
            _build
          key: rebar3-${{ runner.os }}-otp-${{ steps.setup-beam.outputs.otp-version }}-${{ hashFiles('rebar.config', 'rebar.lock') }}
          restore-keys: |
            rebar3-${{ runner.os }}-otp-${{ steps.setup-beam.outputs.otp-version }}-

      - name: CI
        run: make ci
